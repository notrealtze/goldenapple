name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
        env:
          CI: true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: goldenapple-mod
          path: build/libs/*.jar
